name: Build

on:
  push:
    tags: ['v*']
    branches: ['xcmkb']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: ./util/linux-builder/build-in-docker.sh

    - uses: actions/upload-artifact@v4
      with:
        name: Vial-Linux
        path: util/linux-builder/output/Vial-x86_64.AppImage

  # ── macOS ──────────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-15
    env:
      PYTHON_VERSION: 3.6.8
      MACOSX_DEPLOYMENT_TARGET: 10.9
    steps:
    - uses: actions/checkout@v4

    - name: Get Python
      run: curl https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macosx${MACOSX_DEPLOYMENT_TARGET}.pkg -o python.pkg

    - name: Verify download
      run: shasum -a 256 -c <<< '4bcd53faffc98d193ef7cdccd5668de3829c702af4db45258819a84a2cab60d0 *python.pkg'

    - name: Install Python
      run: sudo installer -pkg python.pkg -target /

    - name: Setup venv
      run: |
        python3.6 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: Build
      run: |
        source venv/bin/activate
        fbs freeze
        hdiutil create -volname Vial -srcfolder "target/Vial.app" -ov -format UDZO Vial-Mac.dmg

    - uses: actions/upload-artifact@v4
      with:
        name: Vial-Mac
        path: Vial-Mac.dmg

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.6.x'

    - name: Setup venv
      run: |
        python -m venv venv
        . .\venv\Scripts\activate.ps1
        pip install -r requirements.txt

    - name: Build
      run: |
        . .\venv\Scripts\activate.ps1
        fbs freeze
        Compress-Archive -Path "target\Vial" -DestinationPath Vial-Windows.zip

    - uses: actions/upload-artifact@v4
      with:
        name: Vial-Windows
        path: Vial-Windows.zip

  # ── Release (tags only) ────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./release-assets
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/Vial-Windows.zip
          release-assets/Vial-Mac.dmg
          release-assets/Vial-x86_64.AppImage
        name: XCMKB Vial-GUI ${{ github.ref_name }}
        body: |
          Custom Vial build for XCMKB keyboards (SoflePLUS2).

          **Download:**
          - Windows: `Vial-Windows.zip` — extract and run `Vial.exe`
          - Mac: `Vial-Mac.dmg` — open and drag to Applications
          - Linux: `Vial-x86_64.AppImage` — make executable and run
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
